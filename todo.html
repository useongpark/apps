<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Lists</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; min-height: 100vh; }
.home-body { background: #f0e8d8; min-height: 100vh; padding: 0; display: block; }
.home-header { background: white; padding: 1.1rem 2rem; display: flex; align-items: center; gap: 0.8rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.home-header .logo { font-size: 1.6rem; }
.home-header h1 { font-size: 1.3rem; color: #333; flex: 1; }
.home-header a { font-size: 0.85rem; color: #aaa; text-decoration: none; border: 1px solid #eee; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
.home-header a:hover { color: #555; border-color: #ccc; }
.home-layout { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
.section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #aaa; margin-bottom: 0.9rem; }
.create-box { background: white; border-radius: 14px; padding: 1.4rem; box-shadow: 0 3px 12px rgba(0,0,0,0.07); margin-bottom: 2.2rem; }
.create-row { display: flex; gap: 0.7rem; }
.create-row input { flex: 1; padding: 12px 16px; border: 2px solid #e8dfd0; border-radius: 10px; font-size: 1rem; background: #fffef9; transition: border-color 0.2s; }
.create-row input:focus { outline: none; border-color: #f0a030; }
.create-row button { padding: 12px 22px; background: #f0a030; color: white; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
.create-row button:hover { background: #d88f20; }
.lists-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.list-card { background: white; border-radius: 14px; padding: 1.2rem; box-shadow: 0 3px 12px rgba(0,0,0,0.07); display: flex; flex-direction: column; gap: 0.6rem; transition: transform 0.15s, box-shadow 0.15s; }
.list-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.11); }
.list-card-title { font-size: 1rem; font-weight: 700; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-card-date { font-size: 0.75rem; color: #bbb; }
.list-card-actions { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
.open-btn { flex: 1; padding: 8px 0; background: #f0a030; color: white; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; display: block; transition: background 0.2s; }
.open-btn:hover { background: #d88f20; }
.delete-card-btn { padding: 8px 10px; background: none; border: 1px solid #eee; border-radius: 8px; color: #ccc; cursor: pointer; font-size: 0.82rem; transition: all 0.2s; }
.delete-card-btn:hover { border-color: #ff7070; color: #ff5555; background: #fff5f5; }
.empty-lists { text-align: center; padding: 2.5rem; color: #ccc; background: white; border-radius: 14px; font-size: 0.95rem; box-shadow: 0 3px 12px rgba(0,0,0,0.05); }
.empty-lists span { font-size: 2rem; display: block; margin-bottom: 0.5rem; }
  </style>
</head>
<body class="home-body">

  <div class="home-header">
    <span class="logo">🗒️</span>
    <h1>To-Do Lists</h1>
    <a href="planner.html">🗓️ Planner →</a>
    <a href="index.html">🏠 Home</a>
  </div>

  <div class="home-layout">
    <div class="section-title">Create a new list</div>
    <div class="create-box">
      <div class="create-row">
        <input type="text" id="listTitle" placeholder="List name (e.g. Groceries, Work Tasks...)" />
        <button onclick="createList()">+ Create</button>
      </div>
    </div>

    <div class="section-title">My lists</div>
    <div class="lists-grid" id="listsGrid"></div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://xgumdnnlikiksdhedllz.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndW1kbm5saWtpa3NkaGVkbGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDQxMTgsImV4cCI6MjA5Mjk4MDExOH0.NMJUHruzUgE7PSNaYKRvqBWYKv9vN2lzOpDakZj4-JE'
    );

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('listTitle').addEventListener('keydown', e => {
      if (e.key === 'Enter') createList();
    });

    async function createList() {
      const title = document.getElementById('listTitle').value.trim() || 'My To-Do List';
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
      const { error } = await sb.from('todo_lists').insert({ id, title });
      if (error) { console.error(error); return; }
      document.getElementById('listTitle').value = '';
      window.location.href = `todo-list.html?id=${id}`;
    }

    async function deleteList(id) {
      if (!confirm('Delete this list and all its tasks?')) return;
      const { error } = await sb.from('todo_lists').delete().eq('id', id);
      if (error) { console.error(error); return; }
      renderLists();
    }

    async function renderLists() {
      const grid = document.getElementById('listsGrid');
      grid.innerHTML = `<div class="empty-lists" style="grid-column:1/-1"><span>⏳</span>Loading…</div>`;

      const { data: lists, error } = await sb.from('todo_lists').select('*').order('created_at', { ascending: false });
      if (error) { console.error(error); return; }

      if (!lists || lists.length === 0) {
        grid.innerHTML = `<div class="empty-lists" style="grid-column:1/-1"><span>📋</span>No lists yet — create one above!</div>`;
        return;
      }

      const { data: allTasks } = await sb.from('todo_tasks').select('id,list_id,done');
      const taskMap = {};
      (allTasks || []).forEach(t => {
        if (!taskMap[t.list_id]) taskMap[t.list_id] = { total: 0, done: 0 };
        taskMap[t.list_id].total++;
        if (t.done) taskMap[t.list_id].done++;
      });

      grid.innerHTML = lists.map(l => {
        const counts = taskMap[l.id] || { total: 0, done: 0 };
        const date = new Date(l.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        return `
          <div class="list-card">
            <div class="list-card-title" title="${esc(l.title)}">${esc(l.title)}</div>
            <div class="list-card-date">${counts.total > 0 ? `${counts.done}/${counts.total} done &nbsp;·&nbsp;` : ''}Created ${date}</div>
            <div class="list-card-actions">
              <a class="open-btn" href="todo-list.html?id=${l.id}">Open →</a>
              <button class="delete-card-btn" onclick="deleteList('${l.id}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    renderLists();
  </script>
</body>
</html>
