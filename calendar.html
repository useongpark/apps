<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
:root { --primary:#f0a030; --primary-dark:#d88f20; --bg:#f0e8d8; --card:white; --text:#2c2c2c; --text-sm:#777; --text-muted:#bbb; --border:#ece4d4; --danger:#e74c3c; --success:#27ae60; --shadow:0 3px 14px rgba(0,0,0,0.07); --radius:14px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }
.nav-bar { background: white; display: flex; align-items: center; padding: 0 1.5rem; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); position: sticky; top: 0; z-index: 100; gap: 1.5rem; }
.nav-brand { font-size: 1.05rem; font-weight: 800; color: var(--text); white-space: nowrap; }
.nav-links { display: flex; gap: 0.2rem; flex: 1; align-items: center; }
.nav-link { padding: 6px 13px; border-radius: 8px; text-decoration: none; color: var(--text-sm); font-size: 0.86rem; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
.nav-link:hover { background: #f5f0e8; color: var(--text); }
.nav-link.active { background: var(--primary); color: white; }
.nav-todo { margin-left: auto; border: 1.5px solid #eee; color: #aaa; }
.nav-todo:hover { border-color: #ddd; color: var(--text); background: #fafafa; }
.nav-home { border: 1.5px solid #eee; color: #aaa; }
.nav-home:hover { border-color: #ddd; color: var(--text); background: #fafafa; }
.page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
.card { background: var(--card); border-radius: var(--radius); padding: 1.3rem; box-shadow: var(--shadow); }
.btn { padding: 9px 20px; border-radius: 9px; border: none; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--text-sm); }
.btn-ghost:hover { border-color: #bbb; color: var(--text); }
.btn-danger { background: none; border: 1.5px solid #ffcdd2; color: var(--danger); }
.btn-danger:hover { background: #fff5f5; }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; border-radius: 7px; }
.btn-icon { padding: 4px 7px; background: none; border: none; cursor: pointer; opacity: 0.4; font-size: 0.88rem; border-radius: 6px; transition: all 0.15s; line-height: 1; }
.btn-icon:hover { opacity: 1; background: rgba(0,0,0,0.07); }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-sm); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input { width: 100%; padding: 9px 12px; border: 2px solid var(--border); border-radius: 9px; font-size: 0.92rem; font-family: inherit; background: #fffef9; transition: border-color 0.2s; }
.form-group input:focus { outline: none; border-color: var(--primary); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: white; border-radius: 18px; padding: 1.8rem; width: 100%; max-width: 440px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.4rem; }
.modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.3rem; flex-wrap: wrap; }
.cal-nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.cal-month-label { font-size: 1.3rem; font-weight: 800; }
.cal-btn { background: white; border: 1.5px solid var(--border); border-radius: 9px; padding: 6px 16px; cursor: pointer; font-size: 1rem; transition: background 0.15s; font-family: inherit; font-weight: 600; color: var(--text-sm); }
.cal-btn:hover { background: #f5f0e8; color: var(--text); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-dow { text-align: center; font-size: 0.68rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 0; }
.cal-day { aspect-ratio: 1; background: white; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 0.88rem; font-weight: 600; color: var(--text); transition: all 0.15s; box-shadow: 0 1px 4px rgba(0,0,0,0.05); padding: 4px; gap: 3px; position: relative; }
.cal-day:hover { background: #fff8f0; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
.cal-day.today { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(240,160,48,0.4); }
.cal-day.today:hover { background: var(--primary-dark); }
.cal-day.other { color: var(--text-muted); background: rgba(255,255,255,0.5); box-shadow: none; }
.cal-day.selected { outline: 2.5px solid var(--primary); outline-offset: 2px; }
.cal-day.today.selected { outline-color: white; }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-side { background: white; border-radius: var(--radius); padding: 1.3rem; box-shadow: var(--shadow); }
.cal-side-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; color: var(--text); }
.task-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid #f5f0e8; }
.task-row:last-child { border-bottom: none; }
.task-cb { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
.task-label { flex: 1; font-size: 0.9rem; line-height: 1.35; }
.task-label.done-text { text-decoration: line-through; color: var(--text-muted); }
.section-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.8rem; }
.due-overdue { color: var(--danger); font-weight: 700; font-size: 0.73rem; }
.due-today   { color: var(--primary); font-weight: 700; font-size: 0.73rem; }
.due-soon    { color: #e67e22; font-weight: 600; font-size: 0.73rem; }
.due-normal  { color: var(--text-muted); font-size: 0.73rem; }
.empty-msg { color: var(--text-muted); font-size: 0.86rem; padding: 1.4rem 0; text-align: center; line-height: 1.8; }
@media (max-width: 680px) { .nav-brand { display: none; } .cal-grid { gap: 3px; } }
.cal-day.holiday { background: #fff5f5; }
.cal-day.holiday:hover { background: #ffecec; transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
.cal-day.today.holiday { background: var(--primary); }
.cal-hol-name { position: absolute; bottom: 3px; left: 1px; right: 1px; font-size: 0.46rem; font-weight: 800; color: #c0392b; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1; letter-spacing: -0.2px; }
.cal-day.today .cal-hol-name { color: rgba(255,255,255,0.88); }
.hol-banner { background: #fff0f0; border: 1px solid #ffd0d0; border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; font-size: 0.82rem; font-weight: 700; color: #c0392b; display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<div class="page">

    <div style="flex:1;min-width:320px">
      <div class="card">
        <div class="cal-nav-bar">
          <button class="cal-btn" onclick="changeMonth(-1)">←</button>

        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--text-sm)"><div class="cal-dot" style="background:#3498db"></div> Milestone</div>
        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--text-sm)"><div class="cal-dot" style="background:#e74c3c"></div> Project deadline</div>
        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--text-sm)"><div class="cal-dot" style="background:#9b59b6"></div> Event</div>
        <div style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--text-sm)"><span style="font-size:0.78rem;font-weight:800;color:#c0392b">일</span> 공휴일 (KR Holiday)</div>
      </div>
    </div>
    <div style="flex:0 0 280px;min-width:240px">
      <div class="cal-side">
        <div class="cal-side-title" id="dayPanelTitle">Select a day</div>
        <div id="dayPanel"><div class="empty-msg" style="padding:1rem 0">Click any day on the calendar to see its tasks and events.</div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dueDateModal" style="display:none">
  <div class="modal">
    <div class="modal-title">📅 Set Due Date</div>
    <div class="form-group"><label>Task</label><div id="modalTaskText" style="font-size:0.92rem;padding:6px 0;line-height:1.4"></div></div>
    <div class="form-group"><label>Due Date</label><input type="date" id="modalDueDate" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost"         onclick="closeDueModal()">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="clearDue()">Clear</button>
      <button class="btn btn-primary"       onclick="saveDue()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="eventModal" style="display:none">
  <div class="modal">
    <div class="modal-title">✨ Add Event</div>
    <div id="eventModalDate" style="font-size:0.83rem;color:var(--text-sm);margin:-0.8rem 0 1.2rem;font-weight:600"></div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="eventTitle" placeholder="e.g. Doctor visit, Meeting, Birthday…" />
    </div>
    <div class="form-group">
      <label>Time <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
      <input type="time" id="eventTime" />
    </div>
    <div class="form-group">
      <label>Color</label>
      <div id="eventColorPicker" style="display:flex;gap:8px;flex-wrap:wrap;padding-top:2px"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEventModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()">Add Event</button>
    </div>
  </div>
</div>

<script>

function renderNav(active) {

    { href: 'planner.html',  id: 'today',    icon: '🏠', label: 'Today' },
    { href: 'calendar.html', id: 'calendar', icon: '📅', label: 'Calendar' },

const KR_FIXED = {
  '01-01':'신정','03-01':'삼일절','05-01':'노동절','05-05':'어린이날','06-06':'현충일',
  '08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'크리스마스'
};
const KR_LUNAR = {
  '2024-02-09':'설 연휴','2024-02-10':'설날','2024-02-11':'설 연휴','2024-02-12':'대체공휴일',
  '2024-05-06':'대체공휴일','2024-05-15':'부처님오신날',
  '2024-09-16':'추석 연휴','2024-09-17':'추석','2024-09-18':'추석 연휴',
  '2025-01-28':'설 연휴','2025-01-29':'설날','2025-01-30':'설 연휴',
  '2025-03-03':'대체공휴일','2025-05-05':'어린이날 · 부처님오신날','2025-05-06':'대체공휴일',
  '2025-10-05':'추석 연휴','2025-10-06':'추석','2025-10-07':'추석 연휴','2025-10-08':'대체공휴일',
  '2026-02-16':'설 연휴','2026-02-17':'설날','2026-02-18':'설 연휴',
  '2026-03-02':'대체공휴일','2026-05-24':'부처님오신날','2026-05-25':'대체공휴일',
  '2026-08-17':'대체공휴일',
  '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
  '2026-10-05':'대체공휴일',
  '2027-02-05':'설 연휴','2027-02-06':'설날','2027-02-07':'설 연휴','2027-02-08':'대체공휴일',
  '2027-05-13':'부처님오신날','2027-08-16':'대체공휴일',
  '2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴',
  '2027-10-04':'대체공휴일','2027-10-11':'대체공휴일','2027-12-27':'대체공휴일',
  '2028-01-26':'설 연휴','2028-01-27':'설날','2028-01-28':'설 연휴',
  '2028-05-02':'부처님오신날',
  '2028-10-02':'추석 연휴','2028-10-03':'추석 · 개천절','2028-10-04':'추석 연휴','2028-10-05':'대체공휴일',
};
function getHoliday(dateStr) { return KR_LUNAR[dateStr] || KR_FIXED[dateStr.slice(5)] || null; }

function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function todayStr() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(str) { const [y,m,d]=str.split('-').map(Number); return new Date(y,m-1,d); }
function formatDateShort(str) { if(!str)return''; return parseDate(str).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function daysUntil(str) { const t=new Date();t.setHours(0,0,0,0);return Math.round((parseDate(str)-t)/86400000); }
function dueLabel(str) { if(!str)return''; const d=daysUntil(str); if(d<0)return`<span class="due-overdue">${Math.abs(d)}d overdue</span>`; if(d===0)return`<span class="due-today">Due today</span>`; if(d===1)return`<span class="due-soon">Tomorrow</span>`; if(d<=7)return`<span class="due-soon">In ${d} days</span>`; return`<span class="due-normal">${formatDateShort(str)}</span>`; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(t) { if(!t)return''; const [h,m]=t.split(':').map(Number); return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }

let tasksData=[], listsData=[], milestonesData=[], projectsData=[], eventsData=[];
const EVENT_COLORS = ['#9b59b6','#3498db','#27ae60','#e74c3c','#f0a030','#1abc9c','#e91e63','#ff9800'];
let selectedEventColor = EVENT_COLORS[0];
</script>
<script>
  renderNav('calendar');
  const now=new Date();
  let viewYear=now.getFullYear(), viewMonth=now.getMonth();
  let selectedDate=todayStr();
  let currentTaskId=null;

  function changeMonth(dir) {
    viewMonth+=dir;
    if(viewMonth>11){viewMonth=0;viewYear++;}
    if(viewMonth<0){viewMonth=11;viewYear--;}
    renderCalendar();
  }

  function renderCalendar() {
    const label=new Date(viewYear,viewMonth,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    document.getElementById('calLabel').textContent=label;
    const TODAY=todayStr();
    const dateDots={};
    function addDot(ds,color){if(!dateDots[ds])dateDots[ds]=new Set();dateDots[ds].add(color);}
    tasksData.filter(t=>!t.done&&t.due_date).forEach(t=>addDot(t.due_date,'#f0a030'));
    milestonesData.filter(m=>!m.done&&m.due_date).forEach(m=>{const p=projectsData.find(p=>p.id===m.project_id);addDot(m.due_date,p?.color||'#3498db');});
    projectsData.filter(p=>p.due_date).forEach(p=>addDot(p.due_date,'#e74c3c'));
    eventsData.forEach(e=>addDot(e.date, e.color||'#9b59b6'));
    const firstDay=new Date(viewYear,viewMonth,1).getDay(), daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
    const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for(let i=0;i<firstDay;i++) html+='<div class="cal-day other"></div>';
    for(let d=1;d<=daysInMonth;d++){
      const str=`${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday=str===TODAY, isSelected=str===selectedDate, dots=dateDots[str]?[...dateDots[str]]:[];
      const holiday=getHoliday(str);
      const holName=holiday?`<div class="cal-hol-name">${holiday}</div>`:'';
      html+=`<div class="cal-day${isToday?' today':''}${isSelected?' selected':''}${holiday?' holiday':''}" onclick="selectDay('${str}')"${holiday?` title="${holiday}"`:''}><span style="${holiday&&!isToday?'color:#c0392b;font-weight:800':''}">${d}</span>${dots.length?`<div class="cal-dots">${dots.map(c=>`<div class="cal-dot" style="background:${c}"></div>`).join('')}</div>`:''}${holName}</div>`;
    }
    document.getElementById('calGrid').innerHTML=html;
    renderDayPanel(selectedDate);
  }

  function selectDay(dateStr){selectedDate=dateStr;renderCalendar();}

  function renderDayPanel(dateStr) {
    const [y,m,d]=dateStr.split('-').map(Number), dateObj=new Date(y,m-1,d), isToday=dateStr===todayStr();
    const label=isToday?'Today':dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    document.getElementById('dayPanelTitle').textContent=label;
    let html='';

    // Holiday
    const holiday=getHoliday(dateStr);
    if(holiday) html+=`<div class="hol-banner">🇰🇷 ${holiday}</div>`;

    // Custom events
    const dayEvents=eventsData.filter(e=>e.date===dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem">
      <div class="section-label" style="margin:0">Events</div>
      <button class="btn btn-primary btn-sm" onclick="openEventModal('${dateStr}')">+ Add</button>
    </div>`;
    if(dayEvents.length){
      html+=dayEvents.map(e=>`
        <div class="task-row">
          <div style="width:9px;height:9px;border-radius:50%;background:${e.color||'#9b59b6'};flex-shrink:0"></div>
          <div style="flex:1">
            <div class="task-label">${esc(e.title)}</div>
            ${e.time?`<div style="font-size:0.7rem;color:var(--text-muted)">${fmtTime(e.time)}</div>`:''}
          </div>
          <button class="btn-icon" onclick="deleteEvent('${e.id}')" title="Delete event">🗑️</button>
        </div>`).join('');
    } else {
      html+=`<div style="font-size:0.82rem;color:var(--text-muted);padding:0.3rem 0 0.9rem">No events.</div>`;
    }

    // Tasks from To-Do
    const tasks=tasksData.filter(t=>t.due_date===dateStr);
    if(tasks.length){
      html+=`<div class="section-label" style="margin:0.8rem 0 0.5rem">Tasks</div>`;
      html+=tasks.map(t=>{const list=listsData.find(l=>l.id===t.list_id);return`<div class="task-row"><input type="checkbox" class="task-cb" ${t.done?'checked':''} onchange="checkTask('${t.id}',this.checked)"/><div style="flex:1"><div class="task-label${t.done?' done-text':''}">${esc(t.text)}</div><div style="font-size:0.7rem;color:var(--text-muted)">${esc(list?.title||'')}</div></div><button class="btn-icon" onclick="openDueModal('${t.id}')" title="Change date">✏️</button></div>`;}).join('');
    }

    // Milestones
    const milestones=milestonesData.filter(ms=>ms.due_date===dateStr);
    if(milestones.length){
      html+=`<div class="section-label" style="margin:0.8rem 0 0.5rem">Milestones</div>`;
      html+=milestones.map(ms=>{const p=projectsData.find(p=>p.id===ms.project_id);return`<div class="task-row"><input type="checkbox" class="task-cb" ${ms.done?'checked':''} onchange="toggleMs('${ms.id}',this.checked)"/><div style="flex:1"><div class="task-label${ms.done?' done-text':''}">${esc(ms.text)}</div>${p?`<div style="font-size:0.7rem;color:${p.color||'var(--primary)'};font-weight:600">${esc(p.name)}</div>`:''}</div></div>`;}).join('');
    }

    // Project deadlines
    const projDeadlines=projectsData.filter(p=>p.due_date===dateStr);
    if(projDeadlines.length){
      html+=`<div class="section-label" style="margin:0.8rem 0 0.5rem">Project Deadlines</div>`;
      html+=projDeadlines.map(p=>`<div style="display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid #f5f0e8"><div style="width:10px;height:10px;border-radius:50%;background:${p.color||'#e74c3c'};flex-shrink:0"></div><div style="font-size:0.9rem;font-weight:600">${esc(p.name)}</div><span class="due-overdue" style="font-size:0.72rem">${daysUntil(p.due_date)<0?'Overdue':'Due'}</span></div>`).join('');
    }

    document.getElementById('dayPanel').innerHTML=html;
  }

  // ── Task / Milestone actions ─────────────────────────────────────────────
  async function checkTask(tid, done) {
    const t=tasksData.find(t=>t.id===tid);
    if(t){t.done=done; await sb.from('todo_tasks').update({done}).eq('id',tid);}
    renderDayPanel(selectedDate);
  }

  async function toggleMs(id, done) {
    const ms=milestonesData.find(m=>m.id===id);
    if(ms){ms.done=done; await sb.from('milestones').update({done}).eq('id',id);}
    renderDayPanel(selectedDate);
  }

  function openDueModal(taskId) {
    currentTaskId=taskId;
    const t=tasksData.find(t=>t.id===taskId);
    if(!t)return;
    document.getElementById('modalTaskText').textContent=t.text;
    document.getElementById('modalDueDate').value=t.due_date||'';
    document.getElementById('dueDateModal').style.display='flex';
  }
  function closeDueModal(){document.getElementById('dueDateModal').style.display='none';currentTaskId=null;}
  async function saveDue(){
    const date=document.getElementById('modalDueDate').value;
    if(currentTaskId){const t=tasksData.find(t=>t.id===currentTaskId);if(t){t.due_date=date||null;await sb.from('todo_tasks').update({due_date:date||null}).eq('id',currentTaskId);}}
    closeDueModal();renderCalendar();
  }
  async function clearDue(){
    if(currentTaskId){const t=tasksData.find(t=>t.id===currentTaskId);if(t){t.due_date=null;await sb.from('todo_tasks').update({due_date:null}).eq('id',currentTaskId);}}
    closeDueModal();renderCalendar();
  }
  document.getElementById('dueDateModal').addEventListener('click',e=>{if(e.target.id==='dueDateModal')closeDueModal();});

  // ── Event modal ──────────────────────────────────────────────────────────
  let addingEventDate=null;

  function buildEventColorPicker() {
    document.getElementById('eventColorPicker').innerHTML=EVENT_COLORS.map(c=>`
      <div onclick="selectEventColor('${c}')" style="width:26px;height:26px;border-radius:50%;background:${c};cursor:pointer;border:3px solid ${c===selectedEventColor?'white':'transparent'};box-shadow:${c===selectedEventColor?'0 0 0 2px '+c:'none'};transition:all 0.15s"></div>`).join('');
  }

  function selectEventColor(c) { selectedEventColor=c; buildEventColorPicker(); }

  function openEventModal(dateStr) {
    addingEventDate=dateStr;
    const [y,mm,d]=dateStr.split('-').map(Number), dateObj=new Date(y,mm-1,d);
    document.getElementById('eventModalDate').textContent=dateObj.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
    document.getElementById('eventTitle').value='';
    document.getElementById('eventTime').value='';
    selectedEventColor=EVENT_COLORS[0];
    buildEventColorPicker();
    document.getElementById('eventModal').style.display='flex';
    setTimeout(()=>document.getElementById('eventTitle').focus(),50);
  }
  function closeEventModal(){document.getElementById('eventModal').style.display='none';addingEventDate=null;}

  async function saveEvent() {
    const title=document.getElementById('eventTitle').value.trim();
    if(!title){document.getElementById('eventTitle').focus();return;}
    const time=document.getElementById('eventTime').value||null;
    const id=genId();
    const row={id,date:addingEventDate,title,time,color:selectedEventColor};
    const {error}=await sb.from('calendar_events').insert(row);
    if(error){console.error(error);return;}
    eventsData.push({...row,created_at:new Date().toISOString()});
    closeEventModal();
    renderCalendar();
  }

  async function deleteEvent(id) {
    if(!confirm('Delete this event?'))return;
    const {error}=await sb.from('calendar_events').delete().eq('id',id);
    if(error){console.error(error);return;}
    eventsData=eventsData.filter(e=>e.id!==id);
    renderCalendar();
  }

  document.getElementById('eventModal').addEventListener('click',e=>{if(e.target.id==='eventModal')closeEventModal();});
  document.getElementById('eventTitle').addEventListener('keydown',e=>{if(e.key==='Enter')saveEvent();});

  // ── Init ─────────────────────────────────────────────────────────────────
  (async () => {
    const [{data:lists},{data:tasks},{data:milestones},{data:projects},{data:events}] = await Promise.all([
      sb.from('todo_lists').select('id,title'),
      sb.from('todo_tasks').select('id,list_id,text,done,due_date'),
      sb.from('milestones').select('id,project_id,text,done,due_date'),
      sb.from('projects').select('id,name,color,due_date'),
      sb.from('calendar_events').select('*').order('created_at',{ascending:true}),
    ]);
    listsData=lists||[];
    tasksData=tasks||[];
    milestonesData=milestones||[];
    projectsData=projects||[];
    eventsData=events||[];
    renderCalendar();
  })();
</script>
</body>
</html>
