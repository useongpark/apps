<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner — Today</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
:root { --primary:#f0a030; --primary-dark:#d88f20; --bg:#f0e8d8; --card:white; --text:#2c2c2c; --text-sm:#777; --text-muted:#bbb; --border:#ece4d4; --danger:#e74c3c; --success:#27ae60; --shadow:0 3px 14px rgba(0,0,0,0.07); --radius:14px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }
.nav-bar { background: white; display: flex; align-items: center; padding: 0 1.5rem; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); position: sticky; top: 0; z-index: 100; gap: 1.5rem; }
.nav-brand { font-size: 1.05rem; font-weight: 800; color: var(--text); white-space: nowrap; }
.nav-links { display: flex; gap: 0.2rem; flex: 1; align-items: center; }
.nav-link { padding: 6px 13px; border-radius: 8px; text-decoration: none; color: var(--text-sm); font-size: 0.86rem; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
.nav-link:hover { background: #f5f0e8; color: var(--text); }
.nav-link.active { background: var(--primary); color: white; }
.nav-todo { margin-left: auto; border: 1.5px solid #eee; color: #aaa; }
.nav-todo:hover { border-color: #ddd; color: var(--text); background: #fafafa; }
.nav-home { border: 1.5px solid #eee; color: #aaa; }
.nav-home:hover { border-color: #ddd; color: var(--text); background: #fafafa; }
.page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
.card { background: var(--card); border-radius: var(--radius); padding: 1.3rem; box-shadow: var(--shadow); }
.card-title { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 1rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.btn { padding: 9px 20px; border-radius: 9px; border: none; font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: none; border: 1.5px solid var(--border); color: var(--text-sm); }
.btn-ghost:hover { border-color: #bbb; color: var(--text); }
.btn-danger { background: none; border: 1.5px solid #ffcdd2; color: var(--danger); }
.btn-danger:hover { background: #fff5f5; }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; border-radius: 7px; }
.btn-icon { padding: 4px 7px; background: none; border: none; cursor: pointer; opacity: 0.4; font-size: 0.88rem; border-radius: 6px; transition: all 0.15s; line-height: 1; }
.btn-icon:hover { opacity: 1; background: rgba(0,0,0,0.07); }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-sm); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px 12px; border: 2px solid var(--border); border-radius: 9px; font-size: 0.92rem; font-family: inherit; background: #fffef9; transition: border-color 0.2s; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--primary); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.modal { background: white; border-radius: 18px; padding: 1.8rem; width: 100%; max-width: 440px; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
.modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.4rem; }
.modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.3rem; flex-wrap: wrap; }
.today-date { font-size: 1.9rem; font-weight: 800; color: var(--text); margin-bottom: 0.2rem; }
.today-sub  { font-size: 0.88rem; color: var(--text-sm); margin-bottom: 1.8rem; }
.task-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid #f5f0e8; }
.task-row:last-child { border-bottom: none; }
.task-cb { width: 17px; height: 17px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
.task-label { flex: 1; font-size: 0.9rem; line-height: 1.35; }
.task-label.done-text { text-decoration: line-through; color: var(--text-muted); }
.deadline-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; border-bottom: 1px solid #f5f0e8; }
.deadline-row:last-child { border-bottom: none; }
.deadline-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.deadline-name { flex: 1; font-size: 0.9rem; font-weight: 600; }
.deadline-sub  { font-size: 0.73rem; color: var(--text-sm); }
.empty-msg { color: var(--text-muted); font-size: 0.86rem; padding: 1.4rem 0; text-align: center; line-height: 1.8; }
.habit-check { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--border); background: white; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.88rem; font-weight: 700; color: white; transition: all 0.2s; }
.habit-check.done { background: var(--success); border-color: var(--success); }
.streak-badge { font-size: 0.73rem; font-weight: 700; color: #c67a00; background: #fff3e0; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.streak-zero { color: var(--text-muted); background: #f5f5f5; }
.section-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.8rem; }
.due-overdue { color: var(--danger); font-weight: 700; font-size: 0.73rem; }
.due-today   { color: var(--primary); font-weight: 700; font-size: 0.73rem; }
.due-soon    { color: #e67e22; font-weight: 600; font-size: 0.73rem; }
.due-normal  { color: var(--text-muted); font-size: 0.73rem; }
@media (max-width: 680px) { .grid-2 { grid-template-columns: 1fr; } .nav-brand { display: none; } }
  </style>
</head>
<body>
<div id="nav"></div>

<div class="page">
  <div class="today-date" id="todayDate"></div>
  <div class="today-sub"  id="todaySub"></div>

  <div class="grid-2" style="margin-bottom:1rem">
    <div class="card">
      <div class="card-title">Today's Habits</div>
      <div id="habitsToday"></div>
      <a href="habits.html" style="font-size:0.78rem;color:var(--primary);text-decoration:none;margin-top:0.7rem;display:inline-block">Manage habits →</a>
    </div>
    <div class="card">
      <div class="card-title">Scheduled for Today</div>
      <div id="tasksToday"></div>
      <a href="todo.html" style="font-size:0.78rem;color:var(--primary);text-decoration:none;margin-top:0.7rem;display:inline-block">Open To-Do app ↗</a>
    </div>
  </div>

  <div class="card" style="margin-bottom:1rem">
    <div class="card-title">Upcoming — Next 7 Days</div>
    <div id="upcoming"></div>
  </div>

  <div class="card">
    <div class="card-title">All Tasks — Tap to Set Due Date</div>
    <p style="font-size:0.82rem;color:var(--text-sm);margin-bottom:1rem">Assign dates to your To-Do tasks so they appear on the Calendar and in "Scheduled for Today".</p>
    <div id="allTasks"></div>
  </div>
</div>

<div class="modal-overlay" id="dueDateModal" style="display:none">
  <div class="modal">
    <div class="modal-title">📅 Set Due Date</div>
    <div class="form-group">
      <label>Task</label>
      <div id="modalTaskText" style="font-size:0.92rem;padding:6px 0;line-height:1.4"></div>
    </div>
    <div class="form-group">
      <label>Due Date</label>
      <input type="date" id="modalDueDate" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost"   onclick="closeDueModal()">Cancel</button>
      <button class="btn btn-danger btn-sm" onclick="clearDue()">Clear</button>
      <button class="btn btn-primary" onclick="saveDue()">Save</button>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://xgumdnnlikiksdhedllz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndW1kbm5saWtpa3NkaGVkbGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDQxMTgsImV4cCI6MjA5Mjk4MDExOH0.NMJUHruzUgE7PSNaYKRvqBWYKv9vN2lzOpDakZj4-JE'
);

function renderNav(active) {
  const links = [
    { href: 'planner.html',  id: 'today',    icon: '🏠', label: 'Today' },
    { href: 'calendar.html', id: 'calendar', icon: '📅', label: 'Calendar' },
    { href: 'projects.html', id: 'projects', icon: '🎯', label: 'Projects' },
    { href: 'habits.html',   id: 'habits',   icon: '✅', label: 'Habits' },
  ];
  document.getElementById('nav').innerHTML = `
    <div class="nav-bar">
      <div class="nav-brand">🗓️ Planner</div>
      <div class="nav-links">
        ${links.map(l => `<a href="${l.href}" class="nav-link${l.id === active ? ' active' : ''}">${l.icon} ${l.label}</a>`).join('')}
        <a href="todo.html" class="nav-link nav-todo">📋 To-Do ↗</a>
        <a href="index.html" class="nav-link nav-home">🏠 Home</a>
      </div>
    </div>`;
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateToStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(str) { const [y,m,d]=str.split('-').map(Number); return new Date(y,m-1,d); }
function formatDate(str) { if (!str) return '—'; return parseDate(str).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function formatDateShort(str) { if (!str) return ''; return parseDate(str).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function daysUntil(str) { const t=new Date(); t.setHours(0,0,0,0); return Math.round((parseDate(str)-t)/86400000); }
function dueLabel(str) {
  if (!str) return '';
  const d=daysUntil(str);
  if (d<0)  return `<span class="due-overdue">${Math.abs(d)}d overdue</span>`;
  if (d===0) return `<span class="due-today">Due today</span>`;
  if (d===1) return `<span class="due-soon">Tomorrow</span>`;
  if (d<=7)  return `<span class="due-soon">In ${d} days</span>`;
  return `<span class="due-normal">${formatDateShort(str)}</span>`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let listsData = [], tasksData = [], habitsData = [], logSet = new Set(), projectsData = [], milestonesData = [];

const TodoDB = {
  getLists:    () => listsData,
  getTasks:    (lid) => tasksData.filter(t => t.list_id === lid),
  getAllTasks:  () => tasksData,
  toggleTask:  async (tid, done) => {
    const t = tasksData.find(t => t.id === tid);
    if (t) { t.done = done; await sb.from('todo_tasks').update({ done }).eq('id', tid); }
  },
};
const PDB = {
  getHabits:      () => habitsData,
  isHabitDone:    (hid, date) => logSet.has(`${hid}:${date}`),
  setHabitDone:   async (hid, date, done) => {
    if (done) { logSet.add(`${hid}:${date}`); await sb.from('habit_logs').upsert({ habit_id: hid, date }); }
    else       { logSet.delete(`${hid}:${date}`); await sb.from('habit_logs').delete().eq('habit_id', hid).eq('date', date); }
  },
  getStreak: (hid) => {
    const today = new Date(); today.setHours(0,0,0,0);
    const tk = dateToStr(today), td = PDB.isHabitDone(hid, tk);
    let s = 0, i = td ? 0 : 1;
    while (i < 365) { const d = new Date(today); d.setDate(d.getDate()-i); if (PDB.isHabitDone(hid, dateToStr(d))) { s++; i++; } else break; }
    return s;
  },
  getProjects:      () => projectsData,
  getAllMilestones:  () => milestonesData,
  getMilestones:    (pid) => milestonesData.filter(m => m.project_id === pid),
  getTaskDueDate:   (tid) => tasksData.find(t => t.id === tid)?.due_date || null,
  setTaskDueDate:   async (tid, dueDate) => {
    const t = tasksData.find(t => t.id === tid);
    if (t) { t.due_date = dueDate || null; await sb.from('todo_tasks').update({ due_date: dueDate || null }).eq('id', tid); }
  },
};
</script>
<script>
  renderNav('today');
  const now = new Date();
  document.getElementById('todayDate').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const h = now.getHours();
  document.getElementById('todaySub').textContent = `${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}! Here's your day at a glance.`;
  const TODAY = todayStr();
  let currentTaskId = null, currentListId = null;

  function render() { renderHabits(); renderTasksToday(); renderUpcoming(); renderAllTasks(); }

  function renderHabits() {
    const habits = PDB.getHabits();
    const el = document.getElementById('habitsToday');
    if (!habits.length) { el.innerHTML=`<div class="empty-msg">No habits yet.<br><a href="habits.html" style="color:var(--primary)">Add your first habit →</a></div>`; return; }
    el.innerHTML = habits.map(h => {
      const done=PDB.isHabitDone(h.id,TODAY), streak=PDB.getStreak(h.id);
      return `<div style="display:flex;align-items:center;gap:0.7rem;padding:0.5rem 0;border-bottom:1px solid #f5f0e8">
        <div class="habit-check ${done?'done':''}" onclick="toggleHabit('${h.id}',${done})">${done?'✓':''}</div>
        <span style="flex:1;font-size:0.92rem;font-weight:600${done?';text-decoration:line-through;color:var(--text-muted)':''}">${esc(h.name)}</span>
        <span class="streak-badge${streak===0?' streak-zero':''}">${streak>1?'🔥 ':''}${streak}d</span>
      </div>`;
    }).join('');
  }

  async function toggleHabit(hid, wasDone) {
    await PDB.setHabitDone(hid, TODAY, !wasDone);
    renderHabits();
  }

  function renderTasksToday() {
    const tasks = TodoDB.getAllTasks().filter(t => t.due_date === TODAY);
    const el = document.getElementById('tasksToday');
    if (!tasks.length) { el.innerHTML=`<div class="empty-msg">No tasks scheduled today.<br>Assign dates in the section below.</div>`; return; }
    el.innerHTML = tasks.map(t=>`
      <div class="task-row">
        <input type="checkbox" class="task-cb" ${t.done?'checked':''} onchange="checkTask('${t.id}',this.checked)" />
        <div style="flex:1"><div class="task-label${t.done?' done-text':''}">${esc(t.text)}</div><div style="font-size:0.72rem;color:var(--text-muted)">${esc(t.listTitle)}</div></div>
        <button class="btn-icon" onclick="openDueModal('${t.id}')" title="Change date">📅</button>
      </div>`).join('');
  }

  async function checkTask(tid, done) {
    await TodoDB.toggleTask(tid, done);
    setTimeout(render, 150);
  }

  function renderUpcoming() {
    const projects = PDB.getProjects(), milestones = PDB.getAllMilestones(), items = [];
    TodoDB.getAllTasks().filter(t=>!t.done).forEach(t=>{ const due=t.due_date; if(!due)return; const d=daysUntil(due); if(d>0&&d<=7)items.push({name:t.text,sub:t.listTitle,due,color:'#f0a030',d}); });
    milestones.filter(m=>!m.done&&m.due_date).forEach(m=>{ const d=daysUntil(m.due_date); if(d>=0&&d<=7){const p=projects.find(p=>p.id===m.project_id);items.push({name:m.text,sub:p?.name||'Project',due:m.due_date,color:p?.color||'#3498db',d});} });
    projects.filter(p=>p.due_date).forEach(p=>{ const d=daysUntil(p.due_date); if(d>=0&&d<=7)items.push({name:p.name+' deadline',sub:'Project',due:p.due_date,color:p.color||'#3498db',d}); });
    items.sort((a,b)=>a.d-b.d);
    const el = document.getElementById('upcoming');
    if (!items.length) { el.innerHTML=`<div class="empty-msg">No upcoming deadlines in the next 7 days 🎉</div>`; return; }
    el.innerHTML = items.map(item=>`
      <div class="deadline-row">
        <div class="deadline-dot" style="background:${item.color}"></div>
        <div style="flex:1"><div class="deadline-name">${esc(item.name)}</div><div class="deadline-sub">${esc(item.sub)}</div></div>
        ${dueLabel(item.due)}
      </div>`).join('');
  }

  function renderAllTasks() {
    const lists = TodoDB.getLists(), el = document.getElementById('allTasks');
    if (!lists.length) { el.innerHTML=`<div class="empty-msg">No to-do lists found.<br><a href="todo.html" style="color:var(--primary)">Create one in the To-Do app →</a></div>`; return; }
    let html = '';
    for (const list of lists) {
      const tasks = TodoDB.getTasks(list.id).filter(t=>!t.done);
      if (!tasks.length) continue;
      html += `<div style="margin-bottom:1.1rem"><div class="section-label">${esc(list.title)}</div>${tasks.map(t=>{const due=t.due_date;return`<div class="task-row" style="cursor:pointer" onclick="openDueModal('${t.id}')"><div class="task-label">${esc(t.text)}</div><div>${due?dueLabel(due):`<span style="font-size:0.73rem;color:var(--text-muted)">+ set date</span>`}</div></div>`;}).join('')}</div>`;
    }
    el.innerHTML = html || `<div class="empty-msg">All tasks are done! 🎉</div>`;
  }

  function openDueModal(taskId) {
    currentTaskId = taskId;
    const t = TodoDB.getAllTasks().find(t => t.id === taskId);
    if (!t) return;
    document.getElementById('modalTaskText').textContent = t.text;
    document.getElementById('modalDueDate').value = t.due_date || '';
    document.getElementById('dueDateModal').style.display = 'flex';
  }
  function closeDueModal() { document.getElementById('dueDateModal').style.display='none'; currentTaskId=null; }
  async function saveDue() {
    const date = document.getElementById('modalDueDate').value;
    if (currentTaskId) await PDB.setTaskDueDate(currentTaskId, date || null);
    closeDueModal(); render();
  }
  async function clearDue() {
    if (currentTaskId) await PDB.setTaskDueDate(currentTaskId, null);
    closeDueModal(); render();
  }
  document.getElementById('dueDateModal').addEventListener('click',e=>{if(e.target.id==='dueDateModal')closeDueModal();});

  (async () => {
    const [
      { data: lists }, { data: tasks },
      { data: habits }, { data: logs },
      { data: projects }, { data: milestones }
    ] = await Promise.all([
      sb.from('todo_lists').select('*').order('created_at', { ascending: false }),
      sb.from('todo_tasks').select('*').order('created_at', { ascending: true }),
      sb.from('habits').select('*').order('created_at', { ascending: true }),
      sb.from('habit_logs').select('habit_id,date'),
      sb.from('projects').select('*').order('created_at', { ascending: false }),
      sb.from('milestones').select('*').order('created_at', { ascending: true })
    ]);
    listsData = lists || [];
    const listMap = Object.fromEntries(listsData.map(l => [l.id, l]));
    tasksData = (tasks || []).map(t => ({ ...t, listTitle: listMap[t.list_id]?.title || '', listId: t.list_id }));
    habitsData = habits || [];
    logSet = new Set((logs || []).map(l => `${l.habit_id}:${l.date}`));
    projectsData = projects || [];
    milestonesData = milestones || [];
    render();
  })();
</script>
</body>
</html>
